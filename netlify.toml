# ── Netlify Configuration ──
# App is pure static HTML/JS/CSS — the one build step below exists only to
# make anthropic-proxy.js's shared dependency resolvable to Netlify's
# Function bundler (see proxy/providerAdapters.js's own "NOTE ON
# PACKAGING" comment — this is that comment's predicted fallback, now
# confirmed needed: a live deploy failed with "Cannot find module
# '../../proxy/providerAdapters'" because the bundler does not trace a
# relative require that crosses the netlify/functions/ directory boundary).
# Copies the canonical file in, at build time, rather than hand-maintaining
# a second copy — netlify/functions/providerAdapters.js is gitignored.

[build]
  command = "cp proxy/providerAdapters.js netlify/functions/providerAdapters.js"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/anthropic"
  to = "/.netlify/functions/anthropic-proxy"
  status = 200
